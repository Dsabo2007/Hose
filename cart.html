<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - متجر هوس بوردكيمز</title>
    <link rel="icon" type="image/png" href="image/Mascot.png">
    <meta name="description" content="سلة المشتريات - متجر هوس بوردكيمز">
    <meta name="keywords" content="هوس بوردكيمز, سلة مشتريات, اتمام الشراء">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="products.js"></script>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="glass sticky top-0 z-50 shadow-sm" role="navigation" aria-label="القائمة الرئيسية">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2" aria-label="الصفحة الرئيسية">
                <img src="image/Arabic logo.png" alt="شعار متجر هوس بوردكيمز" class="h-24 w-auto">
            </a>
            <div class="hidden md:flex gap-6 font-medium" role="menubar">
                <a href="index.html" class="text-gray-600 hover:text-indigo-800 transition" role="menuitem">الرئيسية</a>
                <a href="products.html" class="text-gray-600 hover:text-indigo-800 transition" role="menuitem">المنتجات</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="relative hover-scale" aria-label="سلة المشتريات" aria-current="page">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-700" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cart-count"
                        class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden"
                        aria-live="polite">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-10 flex-grow">
        <h1 class="text-3xl font-bold mb-8 text-gradient-blue border-b pb-4">سلة المشتريات</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Cart Items -->
            <div class="lg:w-2/3 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <div id="cart-items-container" class="space-y-6">
                    <!-- Items injected here -->
                    <p class="text-center text-gray-500 py-10">سلتك فارغة حالياً.</p>
                </div>
            </div>

            <!-- Summary & Checkout -->
            <div class="lg:w-1/3 space-y-6 h-fit">
                <!-- Shipping & Payment Info -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-xl font-bold mb-6 text-gradient-blue border-b pb-2">معلومات الشحن والدفع</h2>
                    <form id="checkout-form" class="space-y-4">
                        <!-- Full Name -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">الاسم الكامل <span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="fullName" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                placeholder="الاسم الثلاثي">
                        </div>

                        <!-- Phone Number -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">رقم الهاتف <span
                                    class="text-red-500">*</span></label>
                            <div class="relative" dir="ltr">
                                <span
                                    class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 bg-gray-50 border-r rounded-l-lg px-2 border-gray-300">
                                    +964
                                </span>
                                <input type="tel" id="phone" required maxlength="11"
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                    class="w-full pl-20 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right"
                                    placeholder="07xxxxxxxxx">
                            </div>
                        </div>

                        <!-- Governorate -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">المحافظة <span
                                    class="text-red-500">*</span></label>
                            <select id="governorate" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition bg-white">
                                <option value="" disabled selected>اختر المحافظة</option>
                                <option value="بغداد">بغداد</option>
                                <option value="البصرة">البصرة</option>
                                <option value="نينوى">نينوى</option>
                                <option value="أربيل">أربيل</option>
                                <option value="النجف">النجف</option>
                                <option value="كربلاء">كربلاء</option>
                                <option value="ذي قار">ذي قار</option>
                                <option value="بابل">بابل</option>
                                <option value="الأنبار">الأنبار</option>
                                <option value="كركوك">كركوك</option>
                                <option value="ديالي">ديالي</option>
                                <option value="المثنى">المثنى</option>
                                <option value="القادسية">القادسية</option>
                                <option value="ميسان">ميسان</option>
                                <option value="واسط">واسط</option>
                                <option value="دهوك">دهوك</option>
                                <option value="صلاح الدين">صلاح الدين</option>
                                <option value="السليمانية">السليمانية</option>
                                <option value="حلبجة">حلبجة</option>
                            </select>
                        </div>

                        <!-- Address Details -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">تفاصيل العنوان <span
                                    class="text-red-500">*</span></label>
                            <textarea id="address" rows="3" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                placeholder="حي، محلة، زقاق، دار..."></textarea>
                        </div>

                        <!-- Payment Method -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-4">طريقة الدفع</label>
                            <div class="p-4 rounded-lg border-2 border-indigo-600 bg-indigo-50 flex items-center gap-3">
                                <div
                                    class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white">
                                    <i class="fas fa-money-bill-wave"></i>
                                </div>
                                <div>
                                    <span class="font-bold text-gray-800 block">الدفع عند الاستلام</span>
                                    <span class="text-xs text-gray-500">ادفع نقداً عند وصول طلبك</span>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600 mr-auto"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Order Summary -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-xl font-bold mb-6 text-gray-800">ملخص الطلب</h2>
                    <!-- Itemized Details -->
                    <div id="cart-summary-items" class="mb-6 space-y-3 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                        <!-- Dynamic Item Rows -->
                    </div>

                    <div class="border-t border-gray-100 pt-4 flex justify-between mb-2 text-gray-600">
                        <span>المجموع الفرعي</span>
                        <span id="subtotal">0 ر.س</span>
                    </div>

                    <div class="flex justify-between mb-6 text-xl font-bold text-gradient-blue">
                        <span>الإجمالي</span>
                        <span id="total">0 ر.س</span>
                    </div>

                    <button id="checkout-btn"
                        class="w-full btn-gradient text-white font-bold py-3 rounded-lg transition shadow-md block text-center hover:shadow-lg hover:-translate-y-1">
                        إتمام الشراء
                    </button>
                    <a href="products.html"
                        class="block text-center mt-4 text-gradient-blue font-bold hover:underline text-sm">أكمل
                        التسوق</a>
                </div>
            </div>


        </div>
    </div>
    </div>



    <!-- Footer -->
    <footer class="bg-gradient-premium text-white py-6 mt-auto hidden md:block">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm">&copy; 2026 جميع الحقوق محفوظة.</p>
            <p class="text-xs text-indigo-200 mt-2 font-light">تم التصميم والتطوير بواسطة: المهندس محمد صباح</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('subtotal');

            const totalEl = document.getElementById('total');

            // Mobile elements
            const mobileSummary = document.getElementById('mobile-cart-summary');
            const mobileTotalEl = document.getElementById('mobile-total');

            if (State.cart.length === 0) {
                container.innerHTML = '<div class="text-center py-10 fade-in"><img src="image/Mascot.png" class="w-48 h-auto mx-auto mb-6 opacity-80"><p class="text-gray-500 mb-6 font-bold text-xl">سلتك فارغة حالياً</p><a href="products.html" class="inline-block btn-gradient text-white px-8 py-3 rounded-full font-bold hover:opacity-90 transition shadow-lg hover:shadow-indigo-200">تصفح المنتجات</a></div>';
                subtotalEl.innerHTML = formatPrice(0);

                totalEl.innerHTML = formatPrice(0);
                if (mobileSummary) mobileSummary.classList.add('hidden');

                // Disable form inputs if cart is empty
                const formInputs = document.querySelectorAll('#checkout-form input, #checkout-form select, #checkout-form textarea');
                formInputs.forEach(input => input.disabled = true);
                return;
            }

            if (mobileSummary) mobileSummary.classList.remove('hidden');

            let subtotal = 0;

            container.innerHTML = State.cart.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                const safeName = escapeHtml(item.name);
                return `
            <div class="flex flex-col sm:flex-row items-center gap-4 py-6 border-b border-gray-100 last:border-0 fade-in bg-white rounded-lg p-2 mb-2 sm:mb-0">
                <img src="${item.image}" alt="${safeName}" class="w-20 h-20 object-contain bg-gray-50 rounded-lg p-2 border border-gray-100">
                    <div class="flex-grow text-center sm:text-right w-full sm:w-auto">
                        <h3 class="font-bold text-gray-800 mb-1">${safeName}</h3>
                        <p class="text-gray-500 text-xs bg-gray-100 inline-block px-2 py-1 rounded">${escapeHtml(getCategoryName(item.category))}</p>
                    </div>

                    <div class="flex items-center justify-between w-full sm:w-auto gap-6 mt-2 sm:mt-0">
                        <div class="flex items-center gap-3 border border-gray-200 rounded-lg px-2 py-1 bg-gray-50">
                            <button onclick="updateQuantity(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-red-500 transition font-bold text-lg">-</button>
                            <span class="font-bold text-gray-800 w-6 text-center">${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-green-600 transition font-bold text-lg">+</button>
                        </div>

                        <div class="font-bold text-indigo-700 min-w-[80px] text-left text-lg">
                            ${formatPrice(itemTotal)}
                        </div>

                        <button onclick="removeFromCart(${item.id})" class="text-gray-400 hover:text-red-500 transition p-2 bg-gray-50 rounded-full hover:bg-red-50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
            </div>
            `}).join('');

            const total = subtotal;

            const totalFormatted = formatPrice(total);

            subtotalEl.innerHTML = formatPrice(subtotal);

            totalEl.innerHTML = totalFormatted;

            if (mobileTotalEl) mobileTotalEl.innerText = totalFormatted;

            // Render Summary Items
            const summaryContainer = document.getElementById('cart-summary-items');
            if (summaryContainer) {
                summaryContainer.innerHTML = State.cart.map(item => {
                    const itemTotal = item.price * item.quantity;
                    const safeName = escapeHtml(item.name);
                    return `
                        <div class="flex justify-between items-center text-sm group">
                            <div class="flex flex-col">
                                <span class="font-medium text-gray-700">${safeName}</span>
                                <span class="text-xs text-gray-400">x${item.quantity}</span>
                            </div>
                            <span class="font-bold text-gray-800">${formatPrice(itemTotal)}</span>
                        </div>
                     `;
                }).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await ProductService.init();
            } catch (e) {
                console.error("Init failed", e);
            }
            renderCart();
            setupValidation();
        });

        function setupValidation() {
            const form = document.getElementById('checkout-form');
            const btn = document.getElementById('checkout-btn');
            const inputs = form.querySelectorAll('input, select, textarea');

            // Remove real-time validation blocking
            // We just want to clear errors on input
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('border-red-500', 'ring-2', 'ring-red-200');
                });
            });

            // Checkout Action
            btn.addEventListener('click', async (e) => {
                e.preventDefault();

                // 1. Check if cart is empty
                if (State.cart.length === 0) {
                    showToast('سلتك فارغة!', 'error');
                    return;
                }

                // 2. Validate Inputs
                let isValid = true;
                let firstInvalidInput = null;

                const form = document.getElementById('checkout-form');
                const inputs = form.querySelectorAll('input, select, textarea');

                inputs.forEach(input => {
                    let isInputValid = true;

                    if (input.id === 'phone') {
                        const phoneRegex = /^07[3-9]\d{8}$/;
                        if (!phoneRegex.test(input.value)) {
                            isInputValid = false;
                        }
                    } else {
                        if (!input.value.trim()) {
                            isInputValid = false;
                        }
                    }

                    if (!isInputValid) {
                        isValid = false;
                        input.classList.add('border-red-500', 'ring-2', 'ring-red-200');
                        if (!firstInvalidInput) firstInvalidInput = input;
                    }
                });

                if (!isValid) {
                    showToast('الرجاء إكمال جميع الحقول المطلوبة بشكل صحيح', 'error');
                    if (firstInvalidInput) {
                        firstInvalidInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        firstInvalidInput.focus();
                    }
                    return;
                }

                // UI Loading State
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الطلب...';

                try {
                    // --- Capture Order Data ---
                    const customerData = {
                        name: document.getElementById('fullName').value,
                        phone: document.getElementById('phone').value,
                        governorate: document.getElementById('governorate').value,
                        address: document.getElementById('address').value
                    };

                    const orderTotal = State.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                    const orderData = {
                        date: new Date().toISOString(),
                        customer_name: customerData.name,
                        customer_phone: customerData.phone,
                        customer_governorate: customerData.governorate,
                        items: State.cart,
                        total: orderTotal,
                        status: 'new'
                    };

                    // Insert into Firebase
                    // Add server timestamp
                    orderData.date = firebase.firestore.FieldValue.serverTimestamp();
                    
                    const docRef = await db.collection('orders').add(orderData);

                    const orderForDisplay = { ...orderData, id: docRef.id, customer: customerData };
                    sessionStorage.setItem('lastOrderDetails', JSON.stringify(orderForDisplay));

                    // Clear Cart
                    localStorage.removeItem('boardGameCart');
                    State.cart = [];

                    showToast('تم الطلب بنجاح!', 'success');

                    // Redirect to success page
                    setTimeout(() => {
                        window.location.href = 'success.html';
                    }, 1000);

                } catch (err) {
                    console.error('Checkout error:', err);
                    showToast('حدث خطأ أثناء الطلب: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
        }
    </script>
</body>

</html>
