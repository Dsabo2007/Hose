<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - متجر ألعاب الطاولة</title>
    <link rel="icon" type="image/png" href="image/Mascot.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="products.js"></script>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="glass sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="image/Arabic logo.png" alt="Logo" class="h-10 w-auto">
                <span class="font-bold text-xl text-indigo-700 hidden sm:block">ألعاب الطاولة</span>
            </a>
            <div class="hidden md:flex gap-6  font-medium">
                <a href="index.html" class="text-gray-600 hover:text-indigo-800 transition">الرئيسية</a>
                <a href="products.html" class="text-gray-600 hover:text-indigo-800 transition">المنتجات</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="relative hover-scale">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-700" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cart-count"
                        class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-10 flex-grow">
        <h1 class="text-3xl font-bold mb-8 text-indigo-900 border-b pb-4">سلة المشتريات</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Cart Items -->
            <div class="lg:w-2/3 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <div id="cart-items-container" class="space-y-6">
                    <!-- Items injected here -->
                    <p class="text-center text-gray-500 py-10">سلتك فارغة حالياً.</p>
                </div>
            </div>

            <!-- Summary -->
            <div class="lg:w-1/3 space-y-6">
                <!-- Order Summary -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sticky top-24">
                    <h2 class="text-xl font-bold mb-6 text-gray-800">ملخص الطلب</h2>
                    <div class="flex justify-between mb-4 text-gray-600">
                        <span>المجموع الفرعي</span>
                        <span id="subtotal">0 ر.س</span>
                    </div>

                    <div class="border-t pt-4 flex justify-between mb-6 text-xl font-bold text-indigo-900">
                        <span>الإجمالي</span>
                        <span id="total">0 ر.س</span>
                    </div>
                    <!-- Moved Button Logic to Script, added ID and disabled state -->
                    <button id="checkout-btn" disabled
                        class="w-full bg-gray-400 cursor-not-allowed text-white font-bold py-3 rounded-lg transition shadow-md block text-center">
                        إتمام الشراء
                    </button>
                    <a href="products.html" class="block text-center mt-4 text-indigo-600 hover:underline text-sm">أكمل
                        التسوق</a>
                </div>

                <!-- Shipping & Payment Info -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-xl font-bold mb-6 text-indigo-900 border-b pb-2">معلومات الشحن والدفع</h2>
                    <form id="checkout-form" class="space-y-4">
                        <!-- Full Name -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">الاسم الكامل <span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="fullName" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                placeholder="الاسم الثلاثي">
                        </div>

                        <!-- Phone Number -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">رقم الهاتف <span
                                    class="text-red-500">*</span></label>
                            <div class="relative" dir="ltr">
                                <span
                                    class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 bg-gray-50 border-r rounded-l-lg px-2 border-gray-300">
                                    +964
                                </span>
                                <input type="tel" id="phone" required
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                    class="w-full pl-20 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right"
                                    placeholder="7XX XXX XXXX">
                            </div>
                        </div>

                        <!-- Governorate -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">المحافظة <span
                                    class="text-red-500">*</span></label>
                            <select id="governorate" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition bg-white">
                                <option value="" disabled selected>اختر المحافظة</option>
                                <option value="Baghdad">بغداد</option>
                                <option value="Basra">البصرة</option>
                                <option value="Nineveh">نينوى</option>
                                <option value="Erbil">أربيل</option>
                                <option value="Najaf">النجف</option>
                                <option value="Karbala">كربلاء</option>
                                <option value="Dhi Qar">ذي قار</option>
                                <option value="Babil">بابل</option>
                                <option value="Anbar">الأنبار</option>
                                <option value="Kirkuk">كركوك</option>
                                <option value="Diyala">ديالي</option>
                                <option value="Muthanna">المثنى</option>
                                <option value="Qadisiyah">القادسية</option>
                                <option value="Maysan">ميسان</option>
                                <option value="Wasit">واسط</option>
                                <option value="Duhok">دهوك</option>
                                <option value="Saladin">صلاح الدين</option>
                                <option value="Sulaymaniyah">السليمانية</option>
                                <option value="Halabja">حلبجة</option>
                            </select>
                        </div>

                        <!-- Address Details -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">تفاصيل العنوان <span
                                    class="text-red-500">*</span></label>
                            <textarea id="address" rows="3" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                placeholder="حي، محلة، زقاق، دار..."></textarea>
                        </div>

                        <!-- Payment Method -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-4">طريقة الدفع <span
                                    class="text-red-500">*</span></label>
                            <div class="grid grid-cols-1 gap-3">
                                <label class="cursor-pointer relative">
                                    <input type="radio" name="payment" value="cod" class="peer sr-only" required>
                                    <div
                                        class="p-4 rounded-lg border-2 border-gray-200 hover:border-indigo-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition flex items-center gap-3">
                                        <div
                                            class="w-5 h-5 rounded-full border-2 border-gray-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-600 flex items-center justify-center">
                                            <div class="w-2 h-2 bg-white rounded-full"></div>
                                        </div>
                                        <div class="flex-grow">
                                            <span class="font-bold text-gray-800 block">الدفع عند الاستلام</span>
                                            <span class="text-xs text-gray-500">ادفع نقداً عند وصول طلبك</span>
                                        </div>
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="h-6 w-6 text-gray-400 peer-checked:text-indigo-600" fill="none"
                                            viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                                        </svg>
                                    </div>
                                </label>

                                <label class="cursor-pointer relative">
                                    <input type="radio" name="payment" value="electronic" class="peer sr-only" required>
                                    <div
                                        class="p-4 rounded-lg border-2 border-gray-200 hover:border-indigo-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition flex items-center gap-3">
                                        <div
                                            class="w-5 h-5 rounded-full border-2 border-gray-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-600 flex items-center justify-center">
                                            <div class="w-2 h-2 bg-white rounded-full"></div>
                                        </div>
                                        <div class="flex-grow">
                                            <span class="font-bold text-gray-800 block">بطاقة إلكترونية</span>
                                            <span class="text-xs text-gray-500">MasterCard / Zain Cash</span>
                                        </div>
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="h-6 w-6 text-gray-400 peer-checked:text-indigo-600" fill="none"
                                            viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                                        </svg>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Floating Summary -->
    <div id="mobile-cart-summary" class="mobile-cart-summary md:hidden hidden flex justify-between items-center gap-4">
        <div class="flex flex-col">
            <span class="text-xs text-gray-500">الإجمالي</span>
            <span id="mobile-total" class="font-bold text-xl text-indigo-700">0.00 ر.س</span>
        </div>
        <button class="flex-grow bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg">
            إتمام الشراء
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('subtotal');

            const totalEl = document.getElementById('total');

            // Mobile elements
            const mobileSummary = document.getElementById('mobile-cart-summary');
            const mobileTotalEl = document.getElementById('mobile-total');

            if (State.cart.length === 0) {
                container.innerHTML = '<div class="text-center py-10 fade-in"><img src="image/Mascot.png" class="w-48 h-auto mx-auto mb-6 opacity-80"><p class="text-gray-500 mb-6 font-bold text-xl">سلتك فارغة حالياً</p><a href="products.html" class="inline-block bg-indigo-600 text-white px-8 py-3 rounded-full font-bold hover:bg-indigo-700 transition shadow-lg hover:shadow-indigo-200">تصفح المنتجات</a></div>';
                subtotalEl.innerHTML = formatPrice(0);

                totalEl.innerHTML = formatPrice(0);
                if (mobileSummary) mobileSummary.classList.add('hidden');

                // Disable form inputs if cart is empty
                const formInputs = document.querySelectorAll('#checkout-form input, #checkout-form select, #checkout-form textarea');
                formInputs.forEach(input => input.disabled = true);
                return;
            }

            if (mobileSummary) mobileSummary.classList.remove('hidden');

            let subtotal = 0;

            container.innerHTML = State.cart.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                return `
            <div class="flex flex-col sm:flex-row items-center gap-4 py-6 border-b border-gray-100 last:border-0 fade-in bg-white rounded-lg p-2 mb-2 sm:mb-0">
                <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-contain bg-gray-50 rounded-lg p-2 border border-gray-100">
                    <div class="flex-grow text-center sm:text-right w-full sm:w-auto">
                        <h3 class="font-bold text-gray-800 mb-1">${item.name}</h3>
                        <p class="text-gray-500 text-xs bg-gray-100 inline-block px-2 py-1 rounded">${getCategoryName(item.category)}</p>
                    </div>

                    <div class="flex items-center justify-between w-full sm:w-auto gap-6 mt-2 sm:mt-0">
                        <div class="flex items-center gap-3 border border-gray-200 rounded-lg px-2 py-1 bg-gray-50">
                            <button onclick="updateQuantity(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-red-500 transition font-bold text-lg">-</button>
                            <span class="font-bold text-gray-800 w-6 text-center">${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-green-600 transition font-bold text-lg">+</button>
                        </div>

                        <div class="font-bold text-indigo-700 min-w-[80px] text-left text-lg">
                            ${formatPrice(itemTotal)}
                        </div>

                        <button onclick="removeFromCart(${item.id})" class="text-gray-400 hover:text-red-500 transition p-2 bg-gray-50 rounded-full hover:bg-red-50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
            </div>
            `}).join('');

            const total = subtotal;

            const totalFormatted = formatPrice(total);

            subtotalEl.innerHTML = formatPrice(subtotal);

            totalEl.innerHTML = totalFormatted;

            if (mobileTotalEl) mobileTotalEl.innerText = totalFormatted;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            setupValidation();
        });

        function setupValidation() {
            const form = document.getElementById('checkout-form');
            const btn = document.getElementById('checkout-btn');
            const inputs = form.querySelectorAll('input, select, textarea');

            function checkValidity() {
                let isValid = true;

                // Check if cart is empty
                if (State.cart.length === 0) isValid = false;

                // Check inputs
                inputs.forEach(input => {
                    if (input.type === 'radio') {
                        const checked = document.querySelector(`input[name="${input.name}"]:checked`);
                        if (!checked) isValid = false;
                    } else {
                        if (!input.value.trim()) isValid = false;
                    }
                });

                if (isValid) {
                    btn.disabled = false;
                    btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'hover:-translate-y-1');
                } else {
                    btn.disabled = true;
                    btn.classList.add('bg-gray-400', 'cursor-not-allowed');
                    btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'hover:-translate-y-1');
                }
            }

            inputs.forEach(input => {
                input.addEventListener('input', checkValidity);
                input.addEventListener('change', checkValidity);
            });

            // Initial check
            checkValidity();

            // Checkout Action
            btn.addEventListener('click', (e) => {
                if (btn.disabled) {
                    e.preventDefault();
                    return;
                }

                // --- Capture Order Data ---
                const orderData = {
                    id: Date.now(), // Simple unique ID
                    date: new Date().toISOString(),
                    customer: {
                        name: document.getElementById('fullName').value,
                        phone: document.getElementById('phone').value,
                        governorate: document.getElementById('governorate').value,
                        address: document.getElementById('address').value,
                        paymentMethod: document.querySelector('input[name="payment"]:checked').value
                    },
                    items: State.cart,
                    summary: {
                        subtotal: document.getElementById('subtotal').innerText,
                        total: document.getElementById('total').innerText
                    },
                    status: 'new' // new, completed
                };

                // Save to localStorage
                const orders = JSON.parse(localStorage.getItem('boardGameOrders') || '[]');
                orders.push(orderData);
                localStorage.setItem('boardGameOrders', JSON.stringify(orders));

                // Save for success page
                localStorage.setItem('lastOrderDetails', JSON.stringify(orderData));

                // Clear Cart
                localStorage.removeItem('boardGameCart');
                State.cart = [];

                // Show success toast (briefly before redirect)
                showToast('جاري معالج الطلب...', 'success');

                // Redirect to success page
                setTimeout(() => {
                    window.location.href = 'success.html';
                }, 1000);
            });
        }
    </script>
</body>

</html>
