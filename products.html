<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع المنتجات - متجر هوس بوردكيمز</title>
    <link rel="icon" type="image/png" href="image/Mascot.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="products.js"></script>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="image/Arabic logo.png" alt="Logo" class="h-24 w-auto">
            </a>
            <div class="hidden md:flex gap-6  font-medium">
                <a href="index.html" class="text-gray-600 hover:text-indigo-800 transition">الرئيسية</a>
                <a href="products.html"
                    class="text-gradient-blue font-bold hover:text-indigo-800 transition">المنتجات</a>
            </div>
            <div class="flex items-center gap-4">
                <!-- Currency Switcher -->
                <!-- Currency Switcher Removed -->

                <a href="cart.html" class="relative hover-scale">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-700" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cart-count"
                        class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                </a>
                <button class="md:hidden text-gray-600 focus:outline-none" id="mobile-menu-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 p-4 shadow-lg absolute w-full">
            <a href="index.html" class="block py-2 text-gray-600 hover:text-indigo-600">الرئيسية</a>
            <a href="products.html" class="block py-2 text-gradient-blue font-bold">المنتجات</a>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="bg-gradient-premium text-white py-12 relative overflow-hidden">
        <div class="absolute inset-0 bg-black opacity-20"></div>
        <div class="container mx-auto px-4 relative z-10 text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-4">المتجر</h1>
            <p class="text-indigo-200 text-lg">تصفح مجموعتنا المميزة من هوس بوردكيمز</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">

        <!-- Sidebar / Filters -->
        <aside class="w-full md:w-1/4 space-y-8">
            <!-- Search -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">بحث</h3>
                <div class="relative">
                    <input type="text" id="search-input" placeholder="اسم اللعبة..."
                        class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute left-3 top-3"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <!-- Categories -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">التصنيفات</h3>
                <div class="space-y-2" id="categories-container">
                    <!-- Dynamic Buttons -->
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <section class="w-full md:w-3/4">
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Products Injected Here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gradient-premium text-white py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm">&copy; 2026 جميع الحقوق محفوظة.</p>
            <p class="text-xs text-indigo-200 mt-2 font-light">تم التصميم والتطوير بواسطة: المهندس محمد صباح</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Products
            await ProductService.init();

            // Render Dynamic Categories
            const categoriesInfo = ProductService.getCategories();
            const catContainer = document.getElementById('categories-container');

            catContainer.innerHTML = `
                <button class="filter-btn w-full text-right px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 transition font-bold bg-indigo-100 text-indigo-800" data-category="all">الكل</button>
                ${categoriesInfo.map(cat => `
                    <button class="filter-btn w-full text-right px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 transition" data-category="${cat.id}">${cat.name}</button>
                `).join('')}
            `;

            // Initial Render
            renderProducts(ProductService.getAll());

            // State
            let currentFilter = 'all';
            let currentSearch = '';

            // Elements
            const searchInput = document.getElementById('search-input');
            const filterBtns = document.querySelectorAll('.filter-btn');

            // Filter Logic
            function applyFilters() {
                let filtered = ProductService.getAll();

                if (currentFilter !== 'all') {
                    // Start with loose equality checking to handle string vs int
                    filtered = filtered.filter(p => p.category == currentFilter);
                }

                if (currentSearch) {
                    filtered = filtered.filter(p => p.name.toLowerCase().includes(currentSearch.toLowerCase()));
                }

                renderProducts(filtered);
            }

            // Search Event
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    currentSearch = e.target.value;
                    applyFilters();
                });
            }

            // Filter Buttons Events
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI Update
                    filterBtns.forEach(b => b.classList.remove('bg-indigo-100', 'text-indigo-800', 'font-bold'));
                    btn.classList.add('bg-indigo-100', 'text-indigo-800', 'font-bold');

                    // Filter Update
                    currentFilter = btn.getAttribute('data-category');
                    applyFilters();
                });
            });

            // Mobile Menu
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>

</html>
