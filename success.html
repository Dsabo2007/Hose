<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شكراً لطلبك - متجر هوس بوردكيمز</title>
    <link rel="icon" type="image/png" href="image/Mascot.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="products.js"></script>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="glass sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="image/Arabic logo.png" alt="Logo" class="h-24 w-auto">
            </a>
            <div class="hidden md:flex gap-6  font-medium">
                <a href="index.html" class="text-gray-600 hover:text-indigo-800 transition">الرئيسية</a>
                <a href="products.html" class="text-gray-600 hover:text-indigo-800 transition">المنتجات</a>
            </div>
            <div class="flex items-center gap-4">
                <!-- Empty Cart Icon -->
                <a href="cart.html" class="relative hover-scale">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-700" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-10 flex-grow flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-10 text-center fade-in border border-gray-100">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-green-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-800 mb-4">شكراً لك!</h1>
            <p class="text-xl text-gray-600 mb-8">تم استلام طلبك بنجاح. سنقوم بمراجعته والتواصل معك قريباً لتأكيد الشحن.
            </p>

            <div class="bg-gray-50 rounded-xl p-6 mb-8 text-right max-h-60 overflow-y-auto" id="order-summary">
                <h3 class="font-bold text-gray-700 mb-4 border-b pb-2">ملخص الطلب</h3>
                <!-- Dynamic Content -->
            </div>

            <a href="index.html"
                class="inline-block btn-gradient text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-indigo-200 transition transform hover:-translate-y-1">
                العودة للرئيسية
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gradient-premium text-white py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm">&copy; 2026 جميع الحقوق محفوظة.</p>
            <p class="text-xs text-indigo-200 mt-2 font-light">تم التصميم والتطوير بواسطة: المهندس محمد صباح</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Get cart from local storage BEFORE clearing (or assume script.js loaded it into State)
            // However, script.js initializes State on load.
            // We want to show what was just bought.

            // Check if we have a recent order stored? 
            // Ideally we pass data, but for simplicity, we will read State.cart, display it, then clear it.

            const summaryDiv = document.getElementById('order-summary');

            // Try to get the last order details passed from checkout
            const lastOrderStr = localStorage.getItem('lastOrderDetails');
            let itemsToRender = [];
            let totalToRender = 0;

            if (lastOrderStr) {
                const lastOrder = JSON.parse(lastOrderStr);
                itemsToRender = lastOrder.items || [];
                // Parse total from string "$100" to number if needed, or just use the string. 
                // The previous code calculated total from items. Let's do that to be safe and consistent with formatPrice.
                // Actually, lastOrder.items has the price.
            }

            // Fallback: Check State.cart (though it's likely empty due to checkout clearing it)
            if (itemsToRender.length === 0 && State.cart.length > 0) {
                itemsToRender = State.cart;
                // If we found items in cart here, it means they weren't cleared yet (unlikely with new flow, but good fallback)
                State.cart = [];
                saveCart();
            }



            if (itemsToRender.length > 0) {
                let html = '<ul class="space-y-3">';
                let total = 0;

                itemsToRender.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;

                    html += `
                        <li class="flex justify-between items-center text-sm">
                            <span class="flex items-center gap-2">
                                <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded-full">${item.quantity}x</span> 
                                ${item.name}
                            </span>
                            <span class="font-bold text-gray-700">${formatPrice(itemTotal)}</span>
                        </li>
                     `;
                });

                html += '</ul>';
                html += `
                    <div class="border-t border-gray-200 mt-4 pt-4 flex justify-between font-bold text-lg text-indigo-900">
                        <span>الإجمالي</span>
                        <span>${formatPrice(total)}</span>
                    </div>
                 `;

                // Add Customer Details if available
                if (lastOrderStr) {
                    const lastOrder = JSON.parse(lastOrderStr);
                    if (lastOrder.customer) {
                        html += `
                            <div class="mt-6 border-t border-gray-200 pt-4 text-xs text-gray-500">
                                <p class="font-bold text-gray-700 mb-1">تفاصيل الشحن:</p>
                                <p>${lastOrder.customer.name}</p>
                                <p>${lastOrder.customer.phone}</p>
                                <p>${lastOrder.customer.governorate}, ${lastOrder.customer.address}</p>
                            </div>
                         `;
                    }
                }

                summaryDiv.innerHTML += html;
            } else {
                summaryDiv.innerHTML = '<p class="text-center text-gray-400">لا توجد تفاصيل للعرض (تم تفريغ السلة)</p>';
            }
        });
    </script>
</body>

</html>
